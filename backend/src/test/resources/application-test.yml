spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driverClassName: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Security / JWT properties voor tests
  security:
    jwt:
      secret: test-jwt-secret-key-for-integration-tests-only-1234567890

# Of als je JwtService dit property gebruikt:
app:
  jwt:
    secret: test-jwt-secret-key-for-integration-tests-only-1234567890